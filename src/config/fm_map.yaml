# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket/injection states a fact (delay, authority) that contradicts the DB
stale_policy: FM-06            # superseded or not-yet-effective clause treated as current
clause_sum: FM-04              # add clause parts instead of taking the policy amount
double_deduct: FM-05           # agent subtracts prior refunds itself before the host decides
sibling_refund: FM-07          # "gom đơn": money written under a sibling claim of the same order
denied_ignored: FM-02          # host/approval says no, agent still reports resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold (approval cap)
cross_principal: FM-09         # acts on / reveals an order that belongs to another principal
